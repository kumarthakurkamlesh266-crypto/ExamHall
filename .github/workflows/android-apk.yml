name: Android Debug APK Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web
        run: |
          npm install --no-package-lock
          npm run build
          npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Debug Directory Structure
        run: |
          echo "Listing full directory structure recursively:"
          ls -R
          echo "====================================="
          echo "Searching for build.gradle..."
          find . -name "build.gradle" -not -path "*/node_modules/*"
          echo "Searching for gradlew..."
          find . -name "gradlew" -not -path "*/node_modules/*"

      - name: Grant Execute Permission & Build Debug APK
        run: |
          # Find the gradlew file dynamically
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found in the repository!"
            exit 1
          fi
          
          # Get the directory containing gradlew
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in directory: $GRADLEW_DIR"
          
          # Navigate into that directory
          cd "$GRADLEW_DIR"
          
          # Grant execute permissions and run the build
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
